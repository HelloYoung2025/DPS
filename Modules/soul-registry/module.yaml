      "postgresql:soul_registry.mutation_receipts",
      "postgresql:soul_registry.identity_verifications",
      "postgresql:soul_registry.identity_authority_aliases",
      "postgresql:soul_registry.soul_current_state",
      "postgresql:soul_registry.identity_authority_receipts",
      "postgresql:soul_registry.identity_authority_events"
    ],
    "readModels": [
      "soul-by-verified-alias"
    ],
    "privacyClasses": [
      "personal",
      "sensitive"
    ],
    "retention": "until verified deletion or legal retention expires",
    "export": "export scoped Soul and alias metadata without raw secrets",
    "correction": "append verified alias correction and revoke prior alias",
    "deletion": "tombstone Soul aliases and execute audited privacy erasure"
  },
