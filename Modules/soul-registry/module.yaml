    "trustBoundaries": [
      "module API and versioned contract boundary"
    ],
    "secretScopes": [
      "soul-registry:alias-hmac-keyring",
      "soul-registry-db"
    ],
    "untrustedInputs": [
      "contract payloads",
      "raw identity aliases",
      "alias verification proof",
      "stored text",
      "timestamps"
    ],
    "failClosedOn": [
      "unknown contract major",
      "unknown alias HMAC key id",
      "unverified alias",
      "ambiguous alias mapping",
      "invalid identity scope",
      "missing evidence"
